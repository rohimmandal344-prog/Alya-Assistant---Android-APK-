name: Android Release APK & AAB

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release Version (e.g. 1.0.0 or v1.0.0)'
        required: false
        default: '1.0.0'
      release_title:
        description: 'Release Title'
        required: false
        default: 'Alya Assistant Release'
      is_draft:
        description: 'Create Draft Release'
        type: boolean
        required: false
        default: false
      is_prerelease:
        description: 'Mark as Pre-release'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Prepare Release Signing Keystore
        id: keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD_SECRET: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEY_PASS="${KEY_PASSWORD_SECRET:-alya_release_pwd_2026}"
          STORE_PASS="${STORE_PASSWORD_SECRET:-alya_release_pwd_2026}"

          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from secrets..."
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
          elif [ -f "debug.keystore.base64" ] && [ ! -f "my-upload-key.jks" ]; then
            echo "Generating production-grade release keystore..."
            keytool -genkey -v -keystore my-upload-key.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass "$STORE_PASS" -keypass "$KEY_PASS" -dname "CN=Alya Assistant,OU=Mobile,O=Alya,C=US"
          elif [ ! -f "my-upload-key.jks" ]; then
            echo "Generating release keystore..."
            keytool -genkey -v -keystore my-upload-key.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass "$STORE_PASS" -keypass "$KEY_PASS" -dname "CN=Alya Assistant,OU=Mobile,O=Alya,C=US"
          fi

          echo "STORE_PASSWORD=$STORE_PASS" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$KEY_PASS" >> $GITHUB_ENV
          echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> $GITHUB_ENV
          ls -lh my-upload-key.jks

      - name: Ensure .env exists
        run: |
          if [ ! -f ".env" ]; then
            echo "Creating .env from .env.example..."
            cp .env.example .env
          fi
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          elif ! grep -q "GEMINI_API_KEY" .env; then
            echo "GEMINI_API_KEY=dummy_release_key" >> .env
          fi
          cat .env

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK and App Bundle
        env:
          STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
        run: |
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace -Dorg.gradle.configuration-cache=false

      - name: Collect Release Artifacts
        id: collect
        run: |
          mkdir -p release-output
          TAG_OR_VER="${{ github.ref_name }}"
          if [[ "$TAG_OR_VER" == "main" || "$TAG_OR_VER" == "master" || -z "$TAG_OR_VER" ]]; then
            TAG_OR_VER="${{ github.event.inputs.release_version || '1.0.0' }}"
          fi
          TAG_CLEAN="${TAG_OR_VER#v}"

          # Copy APKs
          APK_FILE=$(find app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)
          if [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" "release-output/Alya-Assistant-v${TAG_CLEAN}-release.apk"
            echo "APK ready: release-output/Alya-Assistant-v${TAG_CLEAN}-release.apk"
          fi

          # Copy AABs
          AAB_FILE=$(find app/build/outputs/bundle/release -type f -name "*.aab" | head -n 1)
          if [ -f "$AAB_FILE" ]; then
            cp "$AAB_FILE" "release-output/Alya-Assistant-v${TAG_CLEAN}-release.aab"
            echo "AAB ready: release-output/Alya-Assistant-v${TAG_CLEAN}-release.aab"
          fi

          echo "RELEASE_VERSION=${TAG_CLEAN}" >> $GITHUB_ENV
          echo "RELEASE_TAG=${TAG_OR_VER}" >> $GITHUB_ENV
          ls -lh release-output/

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alya-assistant-release-${{ env.RELEASE_VERSION }}
          path: release-output/*
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ github.event.inputs.release_title || format('Alya Assistant v{0}', env.RELEASE_VERSION) }}
          body: |
            ## 🚀 Alya Assistant Release v${{ env.RELEASE_VERSION }}

            ### ✨ What's Included:
            - **Real-Time Live Voice & Natural Speech Engine** (Gemini Live 24kHz PCM low-latency audio)
            - **2D Anime Sprite Companion Overlay** with smooth idle, talking, and physics drag & fall animations
            - **Native Android Device Controller** (App launching, Volume/Brightness, Bluetooth, DND, Flashlight, Battery telemetry)
            - **Secure Android Accessibility Bridge** for hands-free UI automation and voice command execution
            - **Offline Capability Engine & Local Database**

            ### 📲 Downloads
            - Direct APK Install: **`Alya-Assistant-v${{ env.RELEASE_VERSION }}-release.apk`**
            - Google Play Bundle: **`Alya-Assistant-v${{ env.RELEASE_VERSION }}-release.aab`**
          draft: ${{ github.event.inputs.is_draft || false }}
          prerelease: ${{ github.event.inputs.is_prerelease || false }}
          files: release-output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
