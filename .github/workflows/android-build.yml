name: Android CI & Debug APK Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Restore or Generate debug.keystore
        run: |
          if [ -f "debug.keystore.base64" ] && [ ! -s "debug.keystore" ]; then
            echo "Decoding debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -s "debug.keystore" ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -lh debug.keystore

      - name: Ensure .env exists
        run: |
          if [ ! -f ".env" ]; then
            echo "Creating .env from .env.example..."
            cp .env.example .env
          fi
          if ! grep -q "GEMINI_API_KEY" .env; then
            echo "GEMINI_API_KEY=dummy_build_key" >> .env
          fi
          cat .env

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m"
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace -Dorg.gradle.configuration-cache=false

      - name: Locate Generated APK
        run: |
          mkdir -p .build-outputs
          find app/build/outputs/apk/debug -type f -name "*.apk" -exec cp {} .build-outputs/ \; 2>/dev/null || true
          find . -type f -name "*.apk" -not -path "*/.*/*" -exec cp {} .build-outputs/ \; || true
          echo "Build outputs:"
          ls -lh .build-outputs/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: alya-assistant-debug-apk
          path: .build-outputs/*.apk
          retention-days: 14
          if-no-files-found: error
