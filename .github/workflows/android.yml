name: Android CI (PR & Push)

on:
  pull_request:
    branches: [ "main", "master" ]
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Test & Build APK Variants (Debug & Release)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Setup Debug & Release Keystores
        id: keystores
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD_SECRET: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          # 1. Setup Debug Keystore
          if [ -f "debug.keystore.base64" ] && [ ! -s "debug.keystore" ]; then
            echo "Decoding debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -s "debug.keystore" ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 2. Setup Release Keystore
          KEY_PASS="${KEY_PASSWORD_SECRET:-alya_ci_keypass_2026}"
          STORE_PASS="${STORE_PASSWORD_SECRET:-alya_ci_storepass_2026}"

          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from repository secrets..."
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
          elif [ ! -f "my-upload-key.jks" ]; then
            echo "Generating signing keystore for release variant build..."
            keytool -genkey -v -keystore my-upload-key.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass "$STORE_PASS" -keypass "$KEY_PASS" -dname "CN=Alya Assistant,OU=Mobile,O=Alya,C=US"
          fi

          echo "STORE_PASSWORD=$STORE_PASS" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$KEY_PASS" >> $GITHUB_ENV
          echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> $GITHUB_ENV

          ls -lh debug.keystore my-upload-key.jks

      - name: Configure Environment & Secrets
        env:
          GEMINI_API_KEY_SECRET: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ ! -f ".env" ]; then
            echo "Initializing .env from .env.example..."
            cp .env.example .env
          fi
          if [ -n "$GEMINI_API_KEY_SECRET" ]; then
            echo "GEMINI_API_KEY=$GEMINI_API_KEY_SECRET" >> .env
          elif ! grep -q "GEMINI_API_KEY" .env; then
            echo "GEMINI_API_KEY=dummy_ci_key" >> .env
          fi
          cat .env

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Run Unit Tests
        env:
          STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
        run: |
          ./gradlew testDebugUnitTest --no-daemon --stacktrace -Dorg.gradle.configuration-cache=false

      - name: Build Debug & Release APKs
        env:
          STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
        run: |
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace -Dorg.gradle.configuration-cache=false

      - name: Organize APK Artifacts
        run: |
          mkdir -p build-apks
          # Copy Debug APK
          DEBUG_APK=$(find app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)
          if [ -f "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" build-apks/Alya-Assistant-debug.apk
            echo "Debug APK ready: build-apks/Alya-Assistant-debug.apk"
          fi

          # Copy Release APK
          RELEASE_APK=$(find app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)
          if [ -f "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" build-apks/Alya-Assistant-release.apk
            echo "Release APK ready: build-apks/Alya-Assistant-release.apk"
          fi

          ls -lh build-apks/

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: alya-assistant-debug-apk
          path: build-apks/Alya-Assistant-debug.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: alya-assistant-release-apk
          path: build-apks/Alya-Assistant-release.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload Unit Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7
          if-no-files-found: ignore
